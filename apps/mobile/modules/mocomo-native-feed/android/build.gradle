plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.mocomo.nativefeed'
version = '1.0.0'

android {
  namespace "net.mocomo.nativefeed"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  implementation "androidx.recyclerview:recyclerview:1.3.2"
  implementation "androidx.paging:paging-runtime-ktx:3.3.2"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
  implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

  implementation "io.coil-kt:coil:2.7.0"

  // Keep in sync with expo-video Media3 version
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-exoplayer:${androidxMedia3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${androidxMedia3Version}"
  implementation "androidx.media3:media3-ui:${androidxMedia3Version}"
  implementation "androidx.media3:media3-database:${androidxMedia3Version}"
  implementation "androidx.media3:media3-datasource:${androidxMedia3Version}"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
