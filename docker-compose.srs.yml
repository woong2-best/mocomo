# 로컬 SRS — RTMP 1935, HLS 8080, API 1985
# 사용: docker compose -f docker-compose.srs.yml up -d
# Next.js: SRS_RTMP_URL=rtmp://127.0.0.1:1935/live
#          NEXT_PUBLIC_SRS_HLS_BASE_URL=http://127.0.0.1:8080/live

services:
  srs:
    image: ossrs/srs:5
    container_name: mocomo-srs
    ports:
      - "1935:1935"
      - "8080:8080"
      - "1985:1985"
    volumes:
      - ./docker/srs/srs.conf:/usr/local/srs/conf/srs.conf
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
