<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Shape Compare — Sofa · Table · Rug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; color: #eee; font: 600 13px/1.4 system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 15px; margin-bottom: 12px; font-weight: 700; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .panel { background: #2a2a2a; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
    .label { padding: 8px 12px; background: #333; font-size: 11px; letter-spacing: 0.02em; }
    .ref-crop {
      width: 100%; aspect-ratio: 4/3; background-color: #ebe4d8;
      background-image: url("/apt/reference/apt-target-mockup.png");
      background-repeat: no-repeat;
    }
    canvas.shape { display: block; width: 100%; aspect-ratio: 4/3; background: #ebe4d8; }
    .sofa-ref { background-size: 195%; background-position: 8% 58%; }
    .table-ref { background-size: 220%; background-position: 14% 68%; }
    .rug-ref { background-size: 210%; background-position: 10% 72%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <h1>Shape Language Compare — Reference vs Style Lock Mesh (neutral gray)</h1>

  <div class="row" id="sofa-row">
    <div class="panel">
      <div class="label">Reference — Sofa</div>
      <div class="ref-crop sofa-ref"></div>
    </div>
    <div class="panel">
      <div class="label">Current — CS-02 Sofa Shape</div>
      <canvas class="shape" id="cv-sofa"></canvas>
    </div>
  </div>

  <div class="row" id="table-row">
    <div class="panel">
      <div class="label">Reference — Coffee Table</div>
      <div class="ref-crop table-ref"></div>
    </div>
    <div class="panel">
      <div class="label">Current — CS-04 Coffee Table Shape</div>
      <canvas class="shape" id="cv-table"></canvas>
    </div>
  </div>

  <div class="row" id="rug-row">
    <div class="panel">
      <div class="label">Reference — Rug</div>
      <div class="ref-crop rug-ref"></div>
    </div>
    <div class="panel">
      <div class="label">Current — CS-03 Rug Shape</div>
      <canvas class="shape" id="cv-rug"></canvas>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const GLB = "/apt/glb/corner-sample";
    const AZ = THREE.MathUtils.degToRad(45);
    const EL = THREE.MathUtils.degToRad(35);

    function fitCamera(camera, object, padding = 1.25) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 2.2;
      camera.position.set(
        center.x + dist * Math.cos(EL) * Math.sin(AZ),
        center.y + dist * Math.sin(EL),
        center.z + dist * Math.cos(EL) * Math.cos(AZ),
      );
      camera.lookAt(center);
      const aspect = 4 / 3;
      const frustum = maxDim * padding;
      camera.left = -frustum * aspect;
      camera.right = frustum * aspect;
      camera.top = frustum;
      camera.bottom = -frustum;
      camera.near = 0.01;
      camera.far = dist * 4;
      camera.updateProjectionMatrix();
      return center;
    }

    async function renderShape(canvasId, glbName, rotY = 0) {
      const canvas = document.getElementById(canvasId);
      const w = 640;
      const h = 480;
      canvas.width = w;
      canvas.height = h;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(w, h, false);
      renderer.setClearColor("#EBE4D8");

      const scene = new THREE.Scene();
      const hemi = new THREE.HemisphereLight("#ffffff", "#cccccc", 0.6);
      scene.add(hemi);
      const key = new THREE.DirectionalLight("#ffffff", 0.9);
      key.position.set(3, 5, 2);
      scene.add(key);
      const fill = new THREE.DirectionalLight("#ffffff", 0.35);
      fill.position.set(-2, 2, -1);
      scene.add(fill);

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);

      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(`${GLB}/${glbName}`);
      const model = gltf.scene;
      model.rotation.y = rotY;
      scene.add(model);

      fitCamera(camera, model);
      renderer.render(scene, camera);
    }

    await Promise.all([
      renderShape("cv-sofa", "cs-02-sofa-shape.glb", Math.PI * 0.12),
      renderShape("cv-table", "cs-04-coffee-table-shape.glb", Math.PI * 0.08),
      renderShape("cv-rug", "cs-03-rug-shape.glb", Math.PI * 0.05),
    ]);

    window.__SHAPE_COMPARE_READY__ = true;
  </script>
</body>
</html>
