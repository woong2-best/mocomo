# MoCoMo — SRS RTMP ingest → HLS (로컬/ VPS)
# 문서: scripts/SRS_STREAMING_SETUP.md

listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    hls {
        enabled             on;
        hls_wait_keyframe   off;
        hls_fragment        2;
        hls_window          10;
        hls_path            ./objs/nginx/html;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # 배포 시 APP_URL을 실제 MoCoMo URL로 바꾸세요 (예: https://mocomo.net)
    http_hooks {
        enabled         on;
        on_publish      https://mocomo.net/api/live/srs-webhook;
        on_unpublish    https://mocomo.net/api/live/srs-webhook;
    }
}
